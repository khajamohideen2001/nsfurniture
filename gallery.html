<style>

/* CHANGE: fluid top padding so the gallery header clears the fixed
   nav on every screen size instead of a single fixed 130px value
   that left too much/too little space at different widths. */
.gallery-page{

padding:clamp(110px,16vw,130px) 0 80px;

}

.filter-buttons{

display:flex;

justify-content:center;

gap:15px;

margin-bottom:44px;

flex-wrap:wrap;

}

.filter-buttons button{

padding:12px 26px;

border:2px solid transparent;

border-radius:40px;

background:#fff;
color:var(--primary);
box-shadow:var(--shadow-sm);

cursor:pointer;

font-weight:600;

transition:transform .3s var(--ease), box-shadow .3s ease, background .3s ease, color .3s ease;

}

.filter-buttons button:hover{

background:var(--gradient-primary);
color:#fff;
transform:translateY(-2px);
box-shadow:var(--shadow);

}

/* CHANGE: active filter state (added via script.js) is now visible,
   not just tracked in the DOM — previously there was no way to tell
   which filter was currently applied. */
.filter-buttons button.active-filter{

background:var(--gradient-accent);
color:#fff;
box-shadow:0 10px 22px rgba(34,197,94,.32);

}

.gallery-container{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(280px,1fr));

gap:22px;

}

.gallery-item{

overflow:hidden;

border-radius:var(--radius);

box-shadow:var(--shadow);

background:linear-gradient(135deg,#e2e8f0,#f1f5f9);

transition:transform .4s var(--ease), box-shadow .4s ease;

}

.gallery-item:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow-hover);
}

.gallery-item img{

width:100%;

height:250px;

object-fit:cover;

transition:transform .5s var(--ease), filter .4s ease;

cursor:pointer;

}

.gallery-item img:hover{

transform:scale(1.08);
filter:brightness(1.03);

}

.gallery-item video{

width:100%;

height:250px;

object-fit:cover;
display:block;

}

.lightbox{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(4,10,22,.92);

justify-content:center;

align-items:center;

z-index:9999;

/* Fade the backdrop in rather than snapping to full opacity */
animation:lightboxFade .25s ease;

}

@keyframes lightboxFade{
    from{ opacity:0; }
    to{ opacity:1; }
}

@media (prefers-reduced-motion: reduce){
    .lightbox{ animation:none; }
}

.lightbox img{

max-width:90%;

max-height:90%;

border-radius:15px;
box-shadow:0 30px 70px rgba(0,0,0,.5);

}

.close{

position:absolute;

top:26px;

right:30px;

font-size:34px;

color:#fff;

cursor:pointer;

width:48px;
height:48px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.12);
transition:background .3s ease, transform .3s ease;

}

.close:hover{
    background:rgba(255,255,255,.22);
    transform:rotate(90deg);
}

.home-btn{

text-align:center;

margin-top:56px;

}

</style>

<script src="js/script.js"></script>

<script>

function filterGallery(type){

const items=document.querySelectorAll('.gallery-item');

items.forEach(item=>{

if(type==="all"){

item.style.display="block";

}

else{

item.style.display=item.classList.contains(type)?"block":"none";

}

});

/* UI fix: visually + semantically mark which filter is active (was previously untracked) */
document.querySelectorAll('.filter-buttons button').forEach(btn=>{
    btn.classList.remove('active-filter');
    btn.setAttribute('aria-pressed','false');
});
event.target.classList.add('active-filter');
event.target.setAttribute('aria-pressed','true');

}

function openImage(src){

document.getElementById("lightbox").style.display="flex";

document.getElementById("lightbox-img").src=src;

/* UI fix: prevent background from scrolling behind the open lightbox */
document.body.style.overflow="hidden";

}

function closeImage(){

document.getElementById("lightbox").style.display="none";

document.body.style.overflow="";

}

/* UI fix: allow closing the lightbox with the Escape key */
document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closeImage();
    }
});

/* UI fix: clicking the dark backdrop (outside the image) also closes the lightbox */
document.getElementById("lightbox").addEventListener("click", function(e){
    if(e.target === this){
        closeImage();
    }
});

</script>
